[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-analytics-pipeline"
version = "0.1.0"
description = "Two-stage speech analytics pipeline using local Whisper transcription, Gemini structured analytics, Pydantic validation, and transcript evidence verification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-whisper>=20231117",
    "torch>=2.2.0",
    "google-genai>=1.10.0",
    "pydantic>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.36.0",
    "pandas>=2.2.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "streamlit_app"]
